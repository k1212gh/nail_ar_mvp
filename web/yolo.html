<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Nail AR — 실제 손톱 인식 (web)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #eee;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #stage { position: relative; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center; }
    #view { max-width: 100vw; max-height: 100vh; display: block; }
    #hud { position: fixed; top: 8px; left: 10px; font-size: 13px;
      text-shadow: 0 0 4px #000, 0 0 4px #000; white-space: pre; pointer-events: none; }
    #controls { position: fixed; bottom: 14px; left: 0; right: 0; display: flex; gap: 8px;
      justify-content: center; align-items: center; flex-wrap: wrap; padding: 0 10px; }
    button, label { background: rgba(30,30,30,.7); color: #fff; border: 1px solid #555;
      border-radius: 8px; padding: 9px 13px; font-size: 14px; }
    #msg { position: fixed; top: 50%; left: 0; right: 0; transform: translateY(-50%);
      text-align: center; padding: 0 24px; font-size: 15px; line-height: 1.6; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="view"></canvas></div>
  <div id="hud"></div>
  <div id="msg">모델 불러오는 중… (처음 한 번 46MB 다운로드)</div>
  <div id="controls" class="hidden">
    <button id="flip">카메라 전환</button>
    <button id="toggle">별 on/off</button>
    <label>크기 <input id="size" type="range" min="0.4" max="1.4" step="0.05" value="0.85" /></label>
  </div>
  <script type="module" src="yolo.js"></script>
</body>
</html>
